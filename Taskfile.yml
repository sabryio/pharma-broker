version: "3"

vars:
  CORE_DIR: core
  BRIDGE_DIR: bridge
  GATEWAY_DIR: gateway

tasks:
  default:
    desc: Build all services
    cmds:
      - task: core:build
      - task: bridge:build
      - task: gateway:build

  # ============================================================================
  # Core (Rust)
  # ============================================================================

  core:build:
    desc: Build the Rust core engine
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo build --release
    sources:
      - "{{.CORE_DIR}}/src/**/*.rs"
      - "{{.CORE_DIR}}/Cargo.toml"
    generates:
      - "{{.CORE_DIR}}/target/release/pharma-core.exe"

  core:dev:
    desc: Run Rust core in dev mode
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run

  core:check:
    desc: Check Rust code compiles
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo check

  core:test:
    desc: Run Rust tests
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo test

  # ============================================================================
  # Bridge (Go)
  # ============================================================================

  bridge:build:
    desc: Build the Go WhatsApp bridge
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - go build -o pharma-bridge.exe .
    sources:
      - "{{.BRIDGE_DIR}}/**/*.go"
    generates:
      - "{{.BRIDGE_DIR}}/pharma-bridge.exe"

  bridge:dev:
    desc: Run Go bridge
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - go run .

  bridge:test:
    desc: Run Go tests
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - go test ./...

  # ============================================================================
  # Gateway (TypeScript)
  # ============================================================================

  gateway:build:
    desc: Build the TypeScript gateway
    dir: "{{.GATEWAY_DIR}}"
    cmds:
      - bun install
    sources:
      - "{{.GATEWAY_DIR}}/src/**/*.ts"
      - "{{.GATEWAY_DIR}}/package.json"

  gateway:dev:
    desc: Run TypeScript gateway
    dir: "{{.GATEWAY_DIR}}"
    cmds:
      - bun run src/index.ts

  # ============================================================================
  # Docker Compose
  # ============================================================================

  up:
    desc: Start all services with Docker Compose
    cmds:
      - docker compose up -d

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  logs:
    desc: View logs from all services
    cmds:
      - docker compose logs -f core bridge gateway

  # ============================================================================
  # Development
  # ============================================================================

  dev:
    desc: Run all services locally (requires 3 terminals)
    cmds:
      - echo "Run in separate terminals:"
      - echo "  Terminal 1: task core:dev"
      - echo "  Terminal 2: task bridge:dev"
      - echo "  Terminal 3: task gateway:dev"

  # ============================================================================
  # Database
  # ============================================================================

  db:up:
    desc: Start PostgreSQL
    cmds:
      - docker compose up -d postgres

  db:migrate:
    desc: Run database migrations
    cmds:
      - docker compose exec postgres psql -U postgres -d pharmabroker -f /docker-entrypoint-initdb.d/001_initial_schema.sql

  # ============================================================================
  # Health Checks
  # ============================================================================

  health:
    desc: Check health of all services
    cmds:
      - cmd: powershell -Command "Invoke-RestMethod http://localhost:8080/health | ConvertTo-Json"
        platforms: [windows]
      - cmd: powershell -Command "Invoke-RestMethod http://localhost:5050/health | ConvertTo-Json"
        platforms: [windows]
      - cmd: powershell -Command "Invoke-RestMethod http://localhost:3000/health | ConvertTo-Json"
        platforms: [windows]
      - cmd: curl -s http://localhost:8080/health | jq
        platforms: [linux, darwin]
      - cmd: curl -s http://localhost:5050/health | jq
        platforms: [linux, darwin]
      - cmd: curl -s http://localhost:3000/health | jq
        platforms: [linux, darwin]

  # ============================================================================
  # Cleanup
  # ============================================================================

  clean:
    desc: Clean all build artifacts
    cmds:
      - cmd: powershell -Command "if (Test-Path 'core/target') { Remove-Item -Recurse -Force 'core/target' }"
        platforms: [windows]
      - cmd: powershell -Command "if (Test-Path 'bridge/pharma-bridge.exe') { Remove-Item -Force 'bridge/pharma-bridge.exe' }"
        platforms: [windows]
      - cmd: rm -rf core/target bridge/pharma-bridge
        platforms: [linux, darwin]

  # ============================================================================
  # Legacy (for reference)
  # ============================================================================

  legacy:build:
    desc: Build legacy Go monolith
    dir: legacy
    cmds:
      - go build -o pharmabroker.exe ./cmd/app

  legacy:test:
    desc: Run legacy Go tests
    dir: legacy
    cmds:
      - go test ./...
