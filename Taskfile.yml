version: "3"

vars:
  CORE_DIR: core
  BRIDGE_DIR: bridge
  FRONTEND_DIR: frontend

tasks:
  default:
    desc: Build all services
    cmds:
      - task: core:build
      - task: bridge:build

  # ============================================================================
  # Core (Rust)
  # ============================================================================

  core:build:
    desc: Build the Rust core engine
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo build --release
    sources:
      - "{{.CORE_DIR}}/src/**/*.rs"
      - "{{.CORE_DIR}}/Cargo.toml"
    generates:
      - "{{.CORE_DIR}}/target/release/pharma-core.exe"

  core:dev:
    desc: Run Rust core in dev mode
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run

  core:check:
    desc: Check Rust code compiles
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo check

  core:test:
    desc: Run Rust tests
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo test

  # --- Core Binaries ---

  core:analyze-models:
    desc: Deep AI model quality analysis across multiple LLMs
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin analyze-models

  core:bench-parser:
    desc: AI parser benchmark with concurrent performance testing
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin bench-parser

  core:bench-hybrid-rag:
    desc: Benchmark hybrid RAG filtering performance impact
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin bench-hybrid-rag

  core:compare-models:
    desc: Compare AI parsing across multiple LLM models
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin compare-models

  core:monitor:
    desc: Interactive TUI for group monitoring and config
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin monitor

  core:parse-cli:
    desc: Interactive CLI for testing AI parsing with messages
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin parse-cli

  core:pipeline-sim:
    desc: Full end-to-end pipeline simulation (ingestion to matching)
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin pipeline-sim

  core:refresh-embeddings:
    desc: Seed medications from JSON and refresh embeddings
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin refresh-embeddings

  core:reset-db:
    desc: "DANGER: Reset database (truncate and reseed)"
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin reset-db

  core:vector-search:
    desc: Vector similarity search playground (RAG testing)
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --bin vector-search

  core:analysis:
    desc: Run data quality analysis (Rust port of Python scripts)
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --package pharma-analysis -- {{.CLI_ARGS}}

  core:analysis:all:
    desc: Run all data analysis phases
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --package pharma-analysis -- all

  core:analysis:health:
    desc: Run database health check
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --package pharma-analysis -- health

  core:analysis:quality:
    desc: Run data quality analysis
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --package pharma-analysis -- quality

  core:analysis:matching:
    desc: Run matching engine analysis
    dir: "{{.CORE_DIR}}"
    cmds:
      - cargo run --package pharma-analysis -- matching

  # ============================================================================
  # Bridge (Go)
  # ============================================================================

  bridge:build:
    desc: Build the Go WhatsApp bridge
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - go build -o pharma-bridge.exe .
    sources:
      - "{{.BRIDGE_DIR}}/**/*.go"
    generates:
      - "{{.BRIDGE_DIR}}/pharma-bridge.exe"

  bridge:dev:
    desc: Run Go bridge
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - go run .

  bridge:test:
    desc: Run Go tests
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - go test ./...

  # ============================================================================
  # Frontend (Bun + React + Vite)
  # ============================================================================

  frontend:dev:
    desc: Run frontend dev server with hot reload
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run dev

  frontend:build:
    desc: Build frontend for production
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run build

  frontend:test:
    desc: Run frontend tests
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run test

  frontend:lint:
    desc: Lint and format frontend code
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run check

  frontend:install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun install

  frontend:docker:
    desc: Run frontend in Docker with live reload
    cmds:
      - docker compose up frontend --build

  # ============================================================================
  # Docker Compose
  # ============================================================================

  up:
    desc: Start all services with Docker Compose
    cmds:
      - docker compose up -d

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  build:
    desc: Build all services
    cmds:
      - docker compose build

  rebuild:
    desc: Fully rebuild and restart all services
    cmds:
      - task: down
      - task: build
      - task: up

  restart:
    desc: Restart all services
    cmds:
      - docker compose restart

  logs:
    desc: View logs from all services
    cmds:
      - docker compose logs -f core bridge

  # ============================================================================
  # Development
  # ============================================================================

  dev:
    desc: Run all services locally (requires 2 terminals)
    cmds:
      - msg "Run in separate terminals:"
      - msg "  Terminal 1 - task core:dev"
      - msg "  Terminal 2 - task bridge:dev"

  # ============================================================================
  # Database
  # ============================================================================

  db:up:
    desc: Start PostgreSQL
    cmds:
      - docker compose up -d postgres

  db:migrate:
    desc: Run database migrations
    cmds:
      - docker compose exec postgres psql -U postgres -d pharmabroker -f /docker-entrypoint-initdb.d/001_initial_schema.sql

  # ============================================================================
  # Health Checks
  # ============================================================================

  health:
    desc: Check health of all services
    cmds:
      - cmd: powershell -Command "Invoke-RestMethod http://localhost:8080/health | ConvertTo-Json"
        platforms: [windows]
      - cmd: powershell -Command "Invoke-RestMethod http://localhost:5050/health | ConvertTo-Json"
        platforms: [windows]
      - cmd: curl -s http://localhost:8080/health | jq
        platforms: [linux, darwin]
      - cmd: curl -s http://localhost:5050/health | jq
        platforms: [linux, darwin]

  # ============================================================================
  # Cleanup
  # ============================================================================

  clean:
    desc: Clean all build artifacts
    cmds:
      - cmd: powershell -Command "if (Test-Path 'core/target') { Remove-Item -Recurse -Force 'core/target' }"
        platforms: [windows]
      - cmd: powershell -Command "if (Test-Path 'bridge/pharma-bridge.exe') { Remove-Item -Force 'bridge/pharma-bridge.exe' }"
        platforms: [windows]
      - cmd: rm -rf core/target bridge/pharma-bridge
        platforms: [linux, darwin]
