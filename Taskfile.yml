version: "3"

vars:
  CLIENT_DIR: internal/api/static/client
  DIST_DIR: internal/api/static/dist

tasks:
  default:
    desc: Build everything
    cmds:
      - task: client
      - task: server

  client:
    desc: Build the React client
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - bun install
      - bun run build
    sources:
      - "{{.CLIENT_DIR}}/src/**/*"
      - "{{.CLIENT_DIR}}/package.json"
      - "{{.CLIENT_DIR}}/vite.config.ts"
    generates:
      - "{{.DIST_DIR}}/**/*"

  server:
    desc: Build the Go server
    deps: [client]
    cmds:
      - go build -o pharmabroker.exe ./cmd/app
    sources:
      - "**/*.go"
      - "{{.DIST_DIR}}/**/*"
    generates:
      - pharmabroker.exe

  dev:client:
    desc: Run React dev server
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - bun --bun run dev

  dev:server:
    desc: Run Go server
    cmds:
      - go run ./cmd/app

  clean:
    desc: Clean build artifacts
    cmds:
      - cmd: powershell -Command "if (Test-Path 'pharmabroker.exe') { Remove-Item -Force 'pharmabroker.exe' }"
        platforms: [windows]
      - cmd: powershell -Command "if (Test-Path '{{.DIST_DIR}}') { Remove-Item -Recurse -Force '{{.DIST_DIR}}' }"
        platforms: [windows]
      - cmd: rm -f pharmabroker pharmabroker.exe
        platforms: [linux, darwin]
      - cmd: rm -rf {{.DIST_DIR}}
        platforms: [linux, darwin]

  embeddings:refresh:
    desc: Refresh medication embeddings from database
    cmds:
      - go run ./cmd/tools/refresh_embeddings

  playground:normalization:
    desc: Test Arabic normalization
    cmds:
      - go run ./cmd/playground/normalization

  playground:fuzzy:
    desc: Test fuzzy matching with Levenshtein distance
    cmds:
      - go run ./cmd/playground/fuzzy_match

  playground:mapping:
    desc: Test full medication mapping pipeline
    cmds:
      - go run ./cmd/playground/mapping_check

  playground:benchmark:
    desc: Benchmark hybrid RAG filtering performance
    cmds:
      - go run ./cmd/playground/benchmark

  monitor:
    desc: Run the application in monitor mode
    cmds:
      - go run ./cmd/app/main.go monitor

  db:reset:
    desc: Reset the database (delete and reseed)
    cmds:
      - go run ./cmd/app/main.go reset-db -f

  db:seed:
    desc: Seed the database with medications from JSON
    cmds:
      - go run ./cmd/playground/mapping_check

  test:integration:
    desc: Run integration tests (requires AI service)
    cmds:
      - go test -tags=integration ./internal/ai/... -v -timeout 5m

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test ./... -v
