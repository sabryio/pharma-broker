syntax = "proto3";

package pharma;

option go_package = "pharma-bridge/proto";

// PharmaCoreService is the main service interface for the Rust core engine
service PharmaCore {
    // ProcessMessage handles incoming WhatsApp messages
    rpc ProcessMessage(RawMessage) returns (ProcessResponse);
    
    // GetStats returns current system statistics
    rpc GetStats(StatsRequest) returns (StatsResponse);
    
    // HealthCheck verifies the service is running
    rpc HealthCheck(HealthRequest) returns (HealthResponse);

    // GetMonitoredGroups returns a list of JIDs that should be monitored
    rpc GetMonitoredGroups(MonitoredGroupsRequest) returns (MonitoredGroupsResponse);

    // SyncGroups syncs WhatsApp groups from Bridge to Core
    rpc SyncGroups(SyncGroupsRequest) returns (SyncGroupsResponse);
}

// PharmaBridgeService is the interface for Core to call Bridge
service PharmaBridge {
    // ConnectMatch tells the bridge to notify parties (and operator) about a match
    rpc ConnectMatch(ConnectMatchRequest) returns (ConnectMatchResponse);
    
    // SendMessage sends a WhatsApp message to a recipient
    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}

// RawMessage represents an incoming WhatsApp message
message RawMessage {
    string id = 1;
    string external_id = 2;
    string group_jid = 3;
    string group_name = 4;
    string sender_jid = 5;
    string sender_phone = 6;
    string sender_name = 7;
    string content = 8;
    int64 timestamp = 9;
    
    // Reply context
    optional string reply_to_id = 10;
    optional string reply_to_content = 11;
    optional string reply_to_sender = 12;
}

// ProcessResponse indicates the result of message processing
message ProcessResponse {
    bool success = 1;
    string message_id = 2;
    optional string error = 3;
}

// StatsRequest for getting system statistics
message StatsRequest {}

// StatsResponse with current system statistics
message StatsResponse {
    int64 active_offers = 1;
    int64 active_requests = 2;
    int64 pending_matches = 3;
    int64 confirmed_today = 4;
    int64 processed_today = 5;
    double avg_match_score = 6;
}

// HealthRequest for health check
message HealthRequest {}

// HealthResponse indicating service health
message HealthResponse {
    bool healthy = 1;
    string version = 2;
    int64 uptime_seconds = 3;
}

// MonitoredGroupsRequest for getting monitored group JIDs
message MonitoredGroupsRequest {}

// MonitoredGroupsResponse with list of JIDs
message MonitoredGroupsResponse {
    repeated string jids = 1;
}

// GroupInfo represents a WhatsApp group
message GroupInfo {
    string jid = 1;
    string name = 2;
    string description = 3;
    int32 member_count = 4;
    repeated string participants = 5;  // List of participant JIDs
}

// SyncGroupsRequest for syncing groups from Bridge to Core
message SyncGroupsRequest {
    repeated GroupInfo groups = 1;
}

// SyncGroupsResponse with sync results
message SyncGroupsResponse {
    bool success = 1;
    int32 added = 2;
    int32 updated = 3;
    string error = 4;
}

// ConnectMatchRequest for notifying parties about a match
message ConnectMatchRequest {
    string match_id = 1;
    string offerer_jid = 2;
    string offerer_phone = 3;
    string offerer_name = 4;
    string requester_jid = 5;
    string requester_phone = 6;
    string requester_name = 7;
    string medication = 8;
}

// ConnectMatchResponse result of connectivity action
message ConnectMatchResponse {
    bool success = 1;
    string error = 2;
}


// SendMessageRequest for sending a WhatsApp message
message SendMessageRequest {
    string recipient_jid = 1;           // WhatsApp JID (e.g., "201234567890@s.whatsapp.net")
    string content = 2;                 // Message text (max 4096 chars)
    optional string reference_id = 3;   // Optional tracking reference from caller
}

// SendMessageResponse result of message send operation
message SendMessageResponse {
    bool success = 1;
    string message_id = 2;              // WhatsApp message ID on success
    optional string error = 3;          // Error message on failure
}
