version: "3.9"

services:
  # Rust Core Engine
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # REST API
      - "50051:50051" # gRPC
    environment:
      - DATABASE_URL=postgres://pharma:pharma@postgres:5432/pharmabroker
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    depends_on:
      - postgres
      - redis

  # Go WhatsApp Bridge
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    environment:
      - CORE_GRPC_ADDR=core:50051
      - WHATSAPP_STORE=/data/whatsapp
    volumes:
      - whatsapp-data:/data/whatsapp
    depends_on:
      - core

  # TypeScript AI Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - CORE_API_URL=http://core:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - core

  # PostgreSQL (same schema as legacy)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pharma
      - POSTGRES_PASSWORD=pharma
      - POSTGRES_DB=pharmabroker
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh

  # Redis (events + cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  whatsapp-data:
