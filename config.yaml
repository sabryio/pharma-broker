# PharmaBroker Configuration
# ===========================
# All values can be overridden via environment variables with PB_ prefix
# Example: PB_AI_PROVIDER, PB_GEMINI_API_KEY, PB_PARSER_MATCH_THRESHOLD

# ---------------------------------
# AI Provider Selection
# ---------------------------------
ai:
  # Which AI backend to use: "gemini" (cloud) or "docker" (local)
  provider: gemini

# ---------------------------------
# Docker Model Runner (local AI)
# ---------------------------------
# Used when ai.provider = "docker"
# Docker Model Runner exposes an OpenAI-compatible API
docker_model:
  # Endpoint URL (auto-injected via LLM_URL when using Compose models)
  # Use model-runner.docker.internal when running in Docker to access host's model runner
  base_url: http://model-runner.docker.internal/engines/llama.cpp/v1

  # Model identifier (auto-injected via LLM_MODEL when using Compose models)
  model: ai/qwen3-vl:latest

  # Retry attempts for failed API calls
  max_retries: 3

  # Initial retry delay (doubles each attempt)
  retry_base_delay: 1s

  # Timeout for API requests (local models can be slower)
  request_timeout: 300s

# ---------------------------------
# Monitoring & Alerting (War Room)
# ---------------------------------
monitor:
  # WhatsApp number for critical alerts (e.g. "1234567890")
  # This serves as the initial seed value for the database configuration.
  # If empty, alerts are disabled until configured via API/DB.
  admin_phone: "201021347532"

# ---------------------------------
# WhatsApp Web Connection Settings
# ---------------------------------
whatsapp:
  # Directory for WhatsApp session data (keys, credentials)
  # Persistent storage allows login without re-scanning QR code
  session_dir: ./data/whatsapp

  # Time to wait before reconnecting after connection failure
  reconnect_delay: 5s

  # Timeout for WhatsApp operations (fetching groups, etc.)
  operation_timeout: 30s

  # Enable groups from config if specified
  # monitored_groups:
  #   - "123456789@g.us"

  # Bot commands for operator interaction via WhatsApp
  bot_commands:
    enabled: true
    # Phone numbers authorized to use bot commands
    # Commands: /status, /pending, /confirm <id>, /reject <id>, /help
    authorized_phones:
      - "+201021347532" # Admin phone

# ---------------------------------
# Google Gemini AI (Cloud)
# ---------------------------------
# Used when ai.provider = "gemini"
gemini:
  # api_key: your-api-key-here  # Or set GEMINI_API_KEY env
  model: gemini-2.5-flash

  # Messages per batch API request (efficiency vs token limits)
  max_messages_per_request: 10

  # Maximum API calls per hour (avoid quota exhaustion)
  rate_limit_per_hour: 100

  # Timeout waiting for AI response
  request_timeout: 30s

  # Retry attempts for failed API calls (uses exponential backoff)
  max_retries: 3

  # Initial delay between retries (doubles each attempt: 1s, 2s, 4s)
  retry_base_delay: 1s

# ---------------------------------
# Message Parser & Matching Engine
# ---------------------------------
parser:
  # How often to process accumulated messages
  # Shorter = faster, longer = more efficient batching
  batch_interval: 5s

  # Minimum similarity score (0.0-1.0) for offer/request matching
  # 0.5 = 50% match, 0.8 = 80% match
  # Lower values = more matches but more false positives
  match_threshold: 0.5

  # Channel buffer for incoming messages (handles bursts)
  message_buffer_size: 1000

# ---------------------------------
# HTTP API Configuration
# ---------------------------------
api:
  # Timeout for standard API requests (listings, updates)
  request_timeout: 5s

  # Timeout for export operations (CSV downloads)
  export_timeout: 30s

  # Interval between SSE heartbeat pings
  # Keeps connections alive and detects disconnected clients
  sse_heartbeat: 30s

  # How long to cache dynamic config from database
  # Reduces DB load for frequently checked settings
  config_cache_ttl: 30s

  # Default items per page in list APIs
  default_page_limit: 50

  # Maximum records in export files
  max_export_records: 1000

# ---------------------------------
# SQLite Database Settings
# ---------------------------------
database:
  # Path to SQLite database file (created if not exists)
  path: ./data/pharmabroker.db

  # Enable WAL mode for better concurrent read/write performance
  enable_wal: true

# ---------------------------------
# Network/Server Settings
# ---------------------------------
server:
  # Main HTTP server port (API + Dashboard)
  port: 8080

  # Health check port (for monitoring)
  health_port: 5050

# ---------------------------------
# Automated Match Reports
# ---------------------------------
reports:
  # Enable scheduled report generation and delivery
  enabled: false

  # Report generation interval in minutes (60 = hourly)
  interval_mins: 60

  # Minimum match score to include in reports (0.0-1.0)
  min_score: 0.5

  # Maximum number of matches per report
  limit: 100

  # Telegram Bot notifications
  telegram:
    enabled: false
    # Create bot via @BotFather, get token
    bot_token: ""
    # Chat IDs to send reports to (use @getidsbot to find IDs)
    # Negative IDs are group chats, positive are individual users
    chat_ids: []
    # Example: ["-1001234567890", "123456789"]

  # Email SMTP notifications
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: "" # Use App Password for Gmail
    from_name: "PharmaBroker"
    from_email: ""
    recipients: []
    # Example: ["admin@pharmacy.com", "manager@pharmacy.com"]

adaptive_learning:
  enabled: false # Safe default
  schedule: "0 3 * * *" # 3 AM daily

  algorithm:
    learning_rate: 0.1
    min_weight: 0.05
    max_weight: 0.70
    min_change: 0.02
    min_samples: 100
    analysis_window_days: 30

  auto_apply:
    enabled: false # Manual review by default
    require_improvement: true
    min_separation_gain: 0.01
    max_confirmation_rate_drop: 0.05

  notifications:
    on_success: true
    on_failure: true
    on_recommendation: true
