name: pharmabroker

services:
  # PostgreSQL with pgvector for semantic search
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: pharma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmabroker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      # For pg18+, mount at /var/lib/postgresql (not /data subdirectory)
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmabroker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # Redis (for future caching/pubsub)
  # redis:
  #   image: redis:8-alpine
  #   container_name: pharma-redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: [ "CMD", "redis-cli", "ping" ]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - pharmabroker-network

  # Rust Core Engine (gRPC + REST API)
  # Now directly uses Docker Model Runner (no TypeScript gateway needed)
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: pharma-core
    environment:
      TZ: Africa/Cairo
      DATABASE_URL: postgres://postgres:password@postgres:5432/pharmabroker
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      API_PORT: "8081"
      GRPC_PORT: "50051"
      WS_AUTH_ENABLED: "false"
      BRIDGE_GRPC_ADDR: "http://bridge:50052"
    ports:
      - "8082:8081" # REST API (changed from 8081 to avoid conflict)
      - "50051:50051" # gRPC
    # volumes:
    #   # DEV ONLY: Mount local binary for hot reload
    #   # Note: This only works if building for Linux target on host
    #   # For cross-platform dev, use: docker compose build core && docker compose up -d core
    #   - ./core/target/release/pharma-core:/app/pharma-core:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pharmabroker-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bind models directly to core service
    models:
      qwen:
        endpoint_var: AI_BASE_URL
        model_var: AI_MODEL
      ministral:
        endpoint_var: MINISTRAL_BASE_URL
        model_var: MINISTRAL_MODEL
      gemma:
        endpoint_var: GEMMA_BASE_URL
        model_var: GEMMA_MODEL
      embedding:
        endpoint_var: EMBEDDING_BASE_URL
        model_var: EMBEDDING_MODEL

  # Go WhatsApp Bridge
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: pharma-bridge
    environment:
      TZ: Africa/Cairo
      BRIDGE_GRPC_CORE_ADDR: ${BRIDGE_GRPC_CORE_ADDR:-core:50051}
      BRIDGE_WHATSAPP_STORE_PATH: ${BRIDGE_WHATSAPP_STORE_PATH:-/app/data/whatsapp.db}
      BRIDGE_WHATSAPP_QR_TERMINAL: ${BRIDGE_WHATSAPP_QR_TERMINAL:-true}
      BRIDGE_HTTP_MODE: ${BRIDGE_HTTP_MODE:-release}
    ports:
      - "5050:5050" # Health server with QR code endpoint
      - "50052:50052" # gRPC server for core/analysis connectivity
    volumes:
      - bridge_data:/app/data
    depends_on:
      - core
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # React Frontend (Bun + Vite with live reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharma-frontend
    environment:
      TZ: Africa/Cairo
      # API endpoint for the frontend to connect to core
      VITE_API_URL: http://localhost:8082
    ports:
      - "3000:3000"
    volumes:
      # Mount entire frontend for live reload
      - ./frontend:/app
      # Keep node_modules inside container (don't sync to host)
      - /app/node_modules
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: pharma-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pharmabroker-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pharma-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - pharmabroker-network
    restart: unless-stopped

# Local AI models via Docker Model Runner
models:
  # Primary LLM for parsing
  qwen:
    model: ai/qwen3-vl:latest
    context_size: 32768
    # runtime_flags:
    #   - "--temp"
    #   - "0.3"

    # Alternative LLM (smaller, faster)
  ministral:
    model: ai/ministral3:latest
    context_size: 32768
    # runtime_flags:
    #   - "--temp"
    #   - "0.3"

    # Alternative LLM (Google)
  gemma:
    model: ai/gemma3:latest
    context_size: 32768
    # runtime_flags:
    #   - "--temp"
    #   - "0.3"

    # Embedding model
  embedding:
    model: ai/embeddinggemma:latest
    context_size: 32768

volumes:
  postgres_data:
  bridge_data:
  prometheus_data:
  grafana_data:

networks:
  pharmabroker-network:
    name: pharmabroker-network
    driver: bridge
