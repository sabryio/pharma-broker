name: pharmabroker

services:
  # PostgreSQL with pgvector for semantic search
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: pharma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmabroker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      # For pg18+, mount at /var/lib/postgresql (not /data subdirectory)
      - ./data/postgres:/var/lib/postgresql
      # Init script to create additional databases (Convex, WhatsApp)
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pharmabroker" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # Redis (for future caching/pubsub)
  # redis:
  #   image: redis:8-alpine
  #   container_name: pharma-redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: [ "CMD", "redis-cli", "ping" ]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - pharmabroker-network

  # Rust Core Engine (gRPC + REST API)
  # Now directly uses Docker Model Runner (no TypeScript gateway needed)
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: pharma-core
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/pharmabroker
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      API_PORT: "8081"
      GRPC_PORT: "50051"
    ports:
      - "8081:8081" # REST API
      - "50051:50051" # gRPC
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pharmabroker-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bind models directly to core service
    models:
      qwen:
        endpoint_var: AI_BASE_URL
        model_var: AI_MODEL
      ministral:
        endpoint_var: MINISTRAL_BASE_URL
        model_var: MINISTRAL_MODEL
      gemma:
        endpoint_var: GEMMA_BASE_URL
        model_var: GEMMA_MODEL
      embedding:
        endpoint_var: EMBEDDING_BASE_URL
        model_var: EMBEDDING_MODEL

  # Go WhatsApp Bridge
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: pharma-bridge
    environment:
      BRIDGE_GRPC_CORE_ADDR: ${BRIDGE_GRPC_CORE_ADDR:-core:50051}
      BRIDGE_WHATSAPP_STORE_PATH: ${BRIDGE_WHATSAPP_STORE_PATH:-/app/data/whatsapp.db}
      BRIDGE_WHATSAPP_QR_TERMINAL: ${BRIDGE_WHATSAPP_QR_TERMINAL:-true}
      BRIDGE_HTTP_MODE: ${BRIDGE_HTTP_MODE:-release}
    ports:
      - "5050:5050" # Health server with QR code endpoint
    volumes:
      - bridge_data:/app/data
    depends_on:
      - core
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # ============================================================================
  # Convex Backend (Self-Hosted)
  # ============================================================================

  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: pharma-convex
    ports:
      - "3210:3210" # Convex API
      - "3211:3211" # HTTP Actions
    volumes:
      - convex_data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      # Use same PostgreSQL for Convex storage
      POSTGRES_URL: postgresql://postgres:password@postgres:5432
      DO_NOT_REQUIRE_SSL: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3210/version" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # Convex Dashboard
  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: pharma-convex-dashboard
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
    depends_on:
      convex:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pharmabroker-network

# Local AI models via Docker Model Runner
models:
  # Primary LLM for parsing
  qwen:
    model: ai/qwen3-vl:latest
    context_size: 16384
    # runtime_flags:
    #   - "--temp"
    #   - "0.3"

    # Alternative LLM (smaller, faster)
  ministral:
    model: ai/ministral3:latest
    context_size: 16384
    # runtime_flags:
    #   - "--temp"
    #   - "0.3"

    # Alternative LLM (Google)
  gemma:
    model: ai/gemma3:latest
    context_size: 16384
    # runtime_flags:
    #   - "--temp"
    #   - "0.3"

    # Embedding model
  embedding:
    model: ai/embeddinggemma:latest
    context_size: 16384

volumes:
  postgres_data:
  bridge_data:
  convex_data:
  prometheus_data:
  grafana_data:


networks:
  pharmabroker-network:
    name: pharmabroker-network
    driver: bridge

