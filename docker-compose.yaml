name: pharmabroker

services:
  # PostgreSQL with pgvector for semantic search
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmabroker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pharmabroker-network

  app:
    build: .
    ports:
      - "8080:8080" # Main HTTP API + Dashboard
      - "5051:5050" # Health check endpoint (external 5051)
    container_name: app
    depends_on:
      - postgres
    environment:
      # AI Provider Selection
      - PB_AI_PROVIDER=docker # Use Docker Model Runner
      # Docker Model Runner (auto-injected by Compose models)
      # - LLM_URL                          # Auto-set from models binding
      # - LLM_MODEL                        # Auto-set from models binding
      # Database
      - PB_DATABASE_PATH=/app/data/pharmabroker.db
      # WhatsApp session
      - PB_WHATSAPP_SESSION_DIR=/app/data/whatsapp
    volumes:
      - ./data:/app/data # Share local session with Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    models:
      - llm # Bind to the llm model
      - embedding-model # Bind to the customized embedding model
    restart: unless-stopped
    networks:
      - pharmabroker-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

# Local LLM model via Docker Model Runner
models:
  llm:
    model: ai/qwen3-vl:latest
    context_size: 16384
    runtime_flags:
      - "--temp"
      - "0.1" # Low temperature for consistent parsing
      - "--threads"
      - "8" # Number of threads for generation
      - "--mlock" # Lock memory to prevent swapping

  embedding-model:
    model: ai/embeddinggemma:latest
    context_size: 8192
    runtime_flags:
      - "--threads"
      - "4"
      - "--mlock"

volumes:
  pharmabroker-data:


networks:
  pharmabroker-network:
    name: pharmabroker-network
    driver: bridge
