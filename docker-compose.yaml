name: pharmabroker

services:
  # PostgreSQL with pgvector for semantic search
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmabroker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pharmabroker-network

  # Main application
  app:
    build: .
    ports:
      - "8080:8080" # Main HTTP API + Dashboard
      - "5051:5050" # Health check endpoint
    container_name: pharmabroker-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # AI Provider - uses Docker Model Runner
      - PB_AI_PROVIDER=docker
      # Database
      - PB_DATABASE_DSN=postgres://postgres:password@postgres:5432/pharmabroker?sslmode=disable
      - PB_WHATSAPP_SESSION_DB_DSN=postgres://postgres:password@postgres:5432/pharmabroker?sslmode=disable
      - PB_WHATSAPP_SESSION_DIR=/app/data/whatsapp
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - pharmabroker-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # Bind to AI models using long syntax with custom env var names
    models:
      llm:
        endpoint_var: LLM_URL
        model_var: LLM_MODEL
      embedding-model:
        endpoint_var: EMBEDDING_MODEL_URL
        model_var: EMBEDDING_MODEL_MODEL

# Local AI models via Docker Model Runner
models:
  llm:
    model: ai/qwen3-vl:latest
    context_size: 16384

  embedding-model:
    model: ai/embeddinggemma:latest
    context_size: 8192

volumes:
  pharmabroker-data:


networks:
  pharmabroker-network:
    name: pharmabroker-network
    driver: bridge
