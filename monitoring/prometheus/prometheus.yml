global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pharma-core"
    static_configs:
      - targets: ["core:8081"]
    metrics_path: /metrics

  # Bridge doesn't expose Prometheus metrics yet
  # - job_name: "pharma-bridge"
  #   static_configs:
  #     - targets: ["bridge:5050"]
  #   metrics_path: /metrics
