[package]
name = "pharma-core"
version = "0.1.0"
edition = "2024"
description = "PharmaBroker Core Engine - Rust implementation"
authors = ["Sabry Awad <dr.sabry97@gmail.com>"]

[dependencies]
# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# Web framework
axum = { version = "0.8.7", features = ["ws"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

# gRPC
tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Utilities
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.17"
anyhow = "1.0.100"
async-trait = "0.1.89"

# Configuration
config = "0.15.19"
dotenvy = "0.15.7"

# HTTP client (for AI gateway)
reqwest = { version = "0.12.26", features = ["json"] }

# Metrics (Prometheus)
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"

# Random (for retry jitter)
rand = "0.9"

# Futures utilities (for WS streams)
futures-util = "0.3.31"
lazy_static = "1.5.0"
regex = "1.12.2"

[dev-dependencies]
tokio-test = "0.4.4"
rstest = "0.26.1"

[build-dependencies]
tonic-prost-build = "0.14.2"
