[workspace]
members = [".", "crates/*"]
resolver = "2"

[package]
name = "pharma-core"
version = "0.1.0"
edition = "2024"
description = "PharmaBroker Core Engine - Rust implementation"
authors = ["Sabry Awad <dr.sabry97@gmail.com>"]

[[bin]]
name = "pharma-core"
path = "src/main.rs"

[[bin]]
name = "bench-parser"
path = "src/bin/bench_parser.rs"
required-features = ["bins"]

[[bin]]
name = "pipeline-sim"
path = "src/bin/pipeline_sim.rs"
required-features = ["bins"]

[[bin]]
name = "parse-cli"
path = "src/bin/parse_cli.rs"
required-features = ["bins"]

[[bin]]
name = "compare-models"
path = "src/bin/compare_models.rs"
required-features = ["bins"]

[[bin]]
name = "analyze-models"
path = "src/bin/analyze_models.rs"
required-features = ["bins"]

[[bin]]
name = "bench-hybrid-rag"
path = "src/bin/bench_hybrid_rag.rs"
required-features = ["bins"]

[[bin]]
name = "vector-search"
path = "src/bin/vector_search.rs"
required-features = ["bins"]

[[bin]]
name = "refresh-embeddings"
path = "src/bin/refresh_embeddings.rs"
required-features = ["bins"]

[[bin]]
name = "reset-db"
path = "src/bin/reset_db.rs"
required-features = ["bins"]

[[bin]]
name = "monitor"
path = "src/bin/monitor.rs"
required-features = ["bins"]

[[bin]]
name = "db-health"
path = "src/bin/db_health.rs"
required-features = ["bins"]

[[bin]]
name = "migrate-identity"
path = "src/bin/migrate_identity.rs"
required-features = ["bins"]

[[bin]]
name = "seed-medications"
path = "src/bin/seed_medications.rs"
required-features = ["bins"]

[dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["full", "tracing"] }

# Tokio Console (runtime debugging)
console-subscriber = { version = "0.5.0", optional = true }

# Web framework
axum = { version = "0.8.8", features = ["ws"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

# gRPC
tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
strsim = "0.11.1"

pgvector = { version = "0.4.1", features = ["sqlx"] }

# Database - SeaORM (recommended)
sea-orm = { version = "1.1.19", features = [
    "mock",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "postgres-vector",
] }
pharma-db = { path = "crates/db" }
rust_decimal = "1.39.0"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

# JSON Schema generation
schemars = { version = "1.2.0", features = ["derive"] }


# Utilities
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.17"
anyhow = "1.0.100"
async-trait = "0.1.89"

# Cryptography (for WebSocket HMAC auth and JWT)
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
jsonwebtoken = "9"

# Configuration
config = "0.15.19"
dotenvy = "0.15.7"

# HTTP client (for AI gateway)
reqwest = { version = "0.13.1", features = ["json"] }

# Metrics (Prometheus)
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"

# Random (for retry jitter)
rand = "0.9.2"

# Futures utilities (for WS streams)
futures-util = "0.3.31"
lazy_static = "1.5.0"
regex = "1.12.2"
tokio-cron-scheduler = "0.15.1"
rayon = "1.11.0"

# Workspace crate
ai-client = { path = "crates/ai-client" }


# Enums
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
prettytable-rs = "0.10.0"
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.0.0"
dialoguer = "0.12.0"

# TUI (for monitor)
ratatui = "0.30.0"
crossterm = "0.29.0"
whatlang = "0.18.0"
tiktoken-rs = "0.9.1"
futures = "0.3.31"

[dev-dependencies]
tokio-test = "0.4.4"
rstest = "0.26.1"
testcontainers = { version = "0.26.3", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.14.0", features = ["postgres"] }
proptest = "1.9.0"

[build-dependencies]
tonic-prost-build = "0.14.2"

[features]
default = []
bins = []                                               # Enable utility binaries (bench-parser, monitor, etc.)
tokio-console = ["console-subscriber", "tokio/tracing"]

# Test phase features - use these to run specific test groups
# Example: cargo test --features test-auto-approve
test-all = ["test-auto-approve", "test-phases", "test-properties"]

# AI Supervised Auto-Approve tests
test-auto-approve = []

# Phase-specific integration tests
test-phases = [
    "test-phase01",
    "test-phase02",
    "test-phase03",
    "test-phase05",
    "test-phase08",
    "test-phase09",
    "test-phase10",
    "test-phase11",
    "test-phase12",
]
test-phase01 = [] # Observability
test-phase02 = [] # Reliability
test-phase03 = [] # Features
test-phase05 = [] # Matching
test-phase08 = [] # Parsing
test-phase09 = [] # Security
test-phase10 = [] # Notifications
test-phase11 = [] # Background
test-phase12 = [] # E2E

# Property-based tests
test-properties = [
    "test-scorer-props",
    "test-expiry-props",
    "test-arabic-props",
    "test-engine-props",
    "test-hard-negative-props",
    "test-pipeline-props",
    "test-pipeline-api-props",
    "test-analytics-props",
]
test-scorer-props = []
test-expiry-props = []
test-arabic-props = []
test-engine-props = []
test-hard-negative-props = []
test-pipeline-props = []
test-pipeline-api-props = []
test-analytics-props = []

# Debug Recording Enhancement integration tests
test-debug-recording = []
