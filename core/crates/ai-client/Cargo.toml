[package]
name = "ai-client"
version = "0.1.0"
edition = "2024"
description = "Generic OpenAI-compatible AI client with structured output support"
license = "MIT"

[dependencies]
# HTTP client
reqwest = { version = "0.12.26", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# JSON Schema generation
schemars = { version = "1.1.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.48.0", features = ["rt", "time"] }

# Error handling
thiserror = "2.0.17"

# Logging
tracing = "0.1.44"

# Random (for retry jitter)
rand = "0.9.2"
