[package]
name = "pharma-analysis"
version = "0.1.0"
edition = "2024"
description = "PharmaBroker Data Analysis Tool - Rust port of Python analysis scripts"
authors = ["Sabry Awad <dr.sabry97@gmail.com>"]

[[bin]]
name = "pharma-analysis"
path = "src/main.rs"

[dependencies]
# Database layer
pharma-db = { path = "../db" }
pharma-core = { path = "../../" }
tonic = "0.14.2"
prost = "0.14.1"
sea-orm = { version = "1.1.19", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# CLI
clap = { version = "4.5.53", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

# Date/Time
chrono = { version = "0.4.42", features = ["serde"] }

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Presentation
prettytable-rs = "0.10.0"
colored = "3.0.0"

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Configuration
dotenvy = "0.15.7"
lazy_static = "1.5.0"
async-trait = "0.1.89"
uuid = { version = "1.13.1", features = ["v4", "serde"] }

# CSV export
csv = "1.3"

# Decimal support
rust_decimal = "1.39"

# Number formatting
num-format = "0.4"
