[package]
name = "pharma-db"
version = "0.1.0"
edition = "2024"
description = "PharmaBroker Database Layer with SeaORM"
authors = ["Sabry Awad <dr.sabry97@gmail.com>"]

[features]
default = []
integration-tests = []

[dependencies]
# SeaORM
sea-orm = { version = "1.1.19", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
    "postgres-vector",
] }
sea-orm-migration = { version = "1.1.19", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }

# Vector support
pgvector = { version = "0.4.1", features = ["sqlx", "postgres"] }

# Async runtime
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Date/Time
chrono = { version = "0.4.42", features = ["serde"] }

# UUID
uuid = { version = "1.19.0", features = ["v4", "serde"] }

# Decimal
rust_decimal = "1.39"

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.100"

# Async traits
async-trait = "0.1.89"

# Tracing
tracing = "0.1.44"

[dev-dependencies]
testcontainers = { version = "0.26.2", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.14.0", features = ["postgres"] }
tokio = { version = "1.48.0", features = ["full", "test-util"] }
rstest = "0.26.1"
